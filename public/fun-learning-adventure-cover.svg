 </g>
</g>
<g fill="#fff" filter="url(#glow)"><path d="M175 680l10-27 10 27 27 10-27 10-10 27-10-27-27-10z"/><path d="M815 625l8-22 8 22 22 8-22 8-8 22-8-22-22-8z"/><path d="M340 570l7-18 7 18 18 7-18 7-7 18-7-18-18-7z"/></g>
<path d="M0 1015q200-120 390-25t510-20v130H0z" fill="#315fdc" opacity=".8"/>
