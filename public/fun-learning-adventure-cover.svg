<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="Modern digital learning illustration">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff0ff"/><stop offset=".48" stop-color="#a9c9ff"/><stop offset="1" stop-color="#536ff1"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bd8ff"/><stop offset=".5" stop-color="#416ce7"/><stop offset="1" stop-color="#7760ec"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#073c9b"/><stop offset=".55" stop-color="#347bfa"/><stop offset="1" stop-color="#b2a0ff"/></linearGradient>
  <linearGradient id="bookBlue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#65caff"/><stop offset="1" stop-color="#1558d4"/></linearGradient>
  <linearGradient id="bookPurple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bb9bff"/><stop offset="1" stop-color="#6844d8"/></linearGradient>
  <linearGradient id="bookGold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe18b"/><stop offset="1" stop-color="#f49b2e"/></linearGradient>
  <radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".35" stop-color="#a9efff"/><stop offset="1" stop-color="#4282ff"/></radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="1100" fill="url(#bg)"/>
